package = "lshort-zh-cn"
version = "6.5"
lua = ">=5.1"

[description]
summary = "The Not So Short Introduction To LaTeX2ε (Chinese Edition)"
maintainer = "Louis Stuart"
labels = [ "Chinese documentation", "Tutorial LaTeX" ]
homepage = "https://github.com/CTeX-org/lshort-zh-cn"
license = "GFDL-1.3"

[source]
url = "https://github.com/CTeX-org/lshort-zh-cn/archive/v6.05.zip"
dir = "lshort-zh-cn-6.05/src"

[build]
type = "command"
build_command = "llmk"

[build.install.conf]
"../doc/lshort-zh-cn.pdf" = "lshort-zh-cn.pdf"

[build_dependencies]
light-latex-make = ">=1.2.0"
lualatex = ">=0.3.20"
makeindex = ">=2.12-2"
cm-unicode = ">=0.7.0"
latex-tools = ">=2026.6.1"
latex-amsmath = ">=2026.6.1"
amscls = ">=2.20.6"
amsfonts = ">=3.4"
hologo = ">=1.15"
fancyvrb = ">=4.6"
ulem = ">=2.12.1"
multirow = ">=2.9"
makecell = ">=0.1.5"
booktabs = ">=1.61803398"
xcolor = ">=3.1"
float = ">=1.3.4"
caption = ">=2023.9.8"
colortbl = ">=1.0.11"
geometry = ">=5.9"
pgf = ">=3.1.10"
ctex = ">=2.6.5"
yhmath = ">=1.6"
hyperref = ">=7.1.18"
jknappen = ">=1.0"
epstopdf-pkg = ">=2.36"
